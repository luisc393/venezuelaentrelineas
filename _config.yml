title: Venezuela Entrelíneas
tagline: Grandes líneas para una Venezuela mejor
description: Noticias buenas de Venezuela, historias que inspiran y material educativo gratuito desde 1996.
url: https://venezuelaentrelineas.com
lang: es
timezone: America/Caracas
permalink: /:year/:month/:title/
markdown: kramdown
logo: /assets/img/marca/simbolo-512.png
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Archivo de publicaciones: cada número es un archivo en su carpeta.
collections:
  entrelineas:
    output: true
    permalink: /leer-entrelineas/:name/
  vertice:
    output: true
    permalink: /vertice/:name/
  articulos:
    output: true
  venezolanos:
    output: true
    permalink: /venezolanos/:name/
  translations:
    output: true
    permalink: /en/articles/:name/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/marca/imagen-compartir.png
  - scope:
      type: entrelineas
    values:
      layout: numero
      publicacion: Leer Entrelíneas
      seccion_url: /leer-entrelineas/
  - scope:
      type: vertice
    values:
      layout: numero
      publicacion: Vértice
      seccion_url: /vertice/

  - scope:
      type: articulos
    values:
      layout: articulo
  - scope:
      type: venezolanos
    values:
      layout: venezolano
  - scope:
      type: translations
    values:
      layout: translation
      lang: en

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
