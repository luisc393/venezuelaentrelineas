<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-name">Venezuela <em>Entrelíneas</em></span>
        <span class="brand-tag">{{ site.tagline }}</span>
      </a>
      <nav class="nav">
        <a href="{{ '/' | relative_url }}">Noticias</a>
        <a href="{{ '/nuestra-historia/' | relative_url }}">Nuestra historia</a>
        <a href="{{ '/leer-entrelineas/' | relative_url }}">Leer Entrelíneas</a>
        <a href="{{ '/participa/' | relative_url }}" class="nav-cta">Participa</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p><strong>Venezuela Entrelíneas</strong> · {{ site.tagline }}</p>
      <p>Sembrando valores, esperanza y paz desde 1996 · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
    </div>
  </footer>
</body>
</html>
